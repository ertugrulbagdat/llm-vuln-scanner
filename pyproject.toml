[project]
name = "llm-vuln-scanner"
version = "0.1.0"
description = "LLM tabanlı sistemlerin prompt injection ve jailbreak dayanıklılığını ölçen tarayıcı"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.9",
    "jinja2>=3.1",
    "pandas>=2.0",
    "plotly>=5.0",
]

[project.optional-dependencies]
# requirements-dev.txt ile aynı tutulur.
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5", "types-PyYAML", "pandas-stubs"]
# requirements.txt'teki "Deneyler ve betikler" ve "Notebook" bölümleriyle aynı tutulur.
experiments = ["scipy>=1.11", "huggingface_hub>=0.20", "pyarrow>=14.0"]
notebook = ["jupyterlab>=4.0", "nbformat>=4.2"]
report = ["weasyprint>=60"]

[project.scripts]
llm-vuln-scanner = "cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# typer, komut imzalarını çalışma zamanında okur: varsayılanlar typer.Option()
# çağrısı olmak zorunda (B008) ve typer 0.9 PEP 604 birleşimini çözemediği için
# `Optional[X]` kullanılır (UP045).
"cli.py" = ["B008", "UP045"]
# Notebook'un ilk hücresi, kullanıcının değiştireceği KURU_PROVA anahtarını en
# üstte tutar ve deney modülünü (karsilastir) içe aktarmadan önce sys.path'e
# eklemek zorundadır; bu yüzden içe aktarmalar hücrenin başında olamaz (E402).
# Betiklerdeki aynı kalıp satır içi `# noqa: E402` ile işaretlenir.
"notebooks/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."

# Testler (pytest fonksiyonları, fixture'lar) için tip ek açıklaması zorunlu
# değil; uygulama kodu strict kalır.
[[tool.mypy.overrides]]
# tests/ bir paket değil (__init__.py yok); mypy modülleri düz adlarıyla görür.
module = [
    "test_adapters",
    "test_analysis",
    "test_engine",
    "test_judge",
    "test_real_adapters",
    "test_reports",
    "test_scoring",
    "test_store",
    "test_templates",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# scipy tip bilgisi (py.typed / stub paketi) yayımlamaz.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
